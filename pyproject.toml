[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-cubed"
version = "0.1.0.dev2"
description = "Skills³ (S³): Skills, Scoring, Stability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sss = "sss.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sss", "sss.*"]
